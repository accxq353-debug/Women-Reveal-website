<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>West Designs — Future Forward Fashion</title>
<meta name="description" content="Pure white minimal futuristic fashion website interface.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--pad-x:clamp(1.25rem,4.5vw,5rem);--header-pt:clamp(1.25rem,2.5vh,2.5rem);--gap-nav:clamp(1rem,2.2vw,2.25rem);--logo:clamp(1.35rem,1.2vw + .9rem,2.1rem);--logo-deg:clamp(.65rem,.4vw + .45rem,.9rem);--nav:clamp(.65rem,.35vw + .5rem,.875rem);--headline:clamp(2.15rem,4.5vw + .75rem,5.25rem);--body:clamp(.7rem,.35vw + .55rem,.9rem);--micro:clamp(.55rem,.25vw + .45rem,.7rem);--btn-px:clamp(1.15rem,1.4vw,1.75rem);--btn-py:clamp(.6rem,.9vh,.85rem);--btn-gap:clamp(.75rem,1vw,1.1rem);--feature-pad:clamp(1rem,1.5vw,1.75rem);--feature-min:clamp(13rem,18vw,20rem);--globe:clamp(2.25rem,2.5vw + 1rem,3.25rem);--checker-w:clamp(2.75rem,4.5vw,6.5rem);--checker-h:clamp(1.35rem,2.2vw,3rem);--corner:clamp(.65rem,.4vw + .4rem,.95rem);--icon:clamp(1rem,.6vw + .7rem,1.35rem);--drawer-pad:clamp(1.25rem,2.5vw,2.25rem);--drawer-max:clamp(18rem,28vw,28rem);--section-gap:clamp(.75rem,1.5vh,1.5rem);--main-py:clamp(1.25rem,4vh,4rem)}
*{box-sizing:border-box;margin:0}
html,body{background:#fff;color:#000}
body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#000;color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.orb{font-family:'Orbitron',sans-serif}
.root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bg{display:none;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg>*{position:absolute;inset:0;background-size:cover;background-position:center 30%;background-repeat:no-repeat}
#bg svg{width:100%;height:100%;opacity:.1}
header{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:var(--header-pt) var(--pad-x) var(--section-gap)}
.logo{font-weight:900;letter-spacing:.15em;font-size:var(--logo);white-space:nowrap}
.logo:hover{opacity:.8}.logo sup{font-size:var(--logo-deg);margin:-2px 0 0 2px;vertical-align:top;line-height:1}
nav{display:flex;align-items:center;gap:var(--gap-nav);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:var(--nav)}
nav button:hover{opacity:.5}nav .sep{color:#9ca3af}
nav .nl{display:none}
.bag{position:relative;display:flex}.bag svg{width:var(--icon);height:var(--icon)}
.badge{position:absolute;top:-.45rem;right:-.55rem;background:#000;color:#fff;border-radius:50%;width:1rem;height:1rem;font-size:.55rem;display:none;align-items:center;justify-content:center;letter-spacing:0}
main{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2rem;padding:var(--main-py) var(--pad-x)}
.left{display:flex;flex-direction:column;justify-content:center;gap:1.25rem}
.corner{width:var(--corner);height:var(--corner);stroke:#000;stroke-width:1.5;fill:none}
h1{font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.05;font-size:var(--headline)}
h1 span{display:flex;align-items:center;gap:.3em}
h1 svg{width:var(--checker-w);height:var(--checker-h);transform:translateY(2px)}
.cta{display:inline-flex;align-items:center;gap:var(--btn-gap);align-self:flex-start;border:1px solid #9ca3af;border-radius:6px;text-transform:uppercase;letter-spacing:.18em;font-size:var(--body);padding:var(--btn-py) var(--btn-px);font-weight:500;transition:.2s}
.cta:hover{background:#000;color:#fff;border-color:#000}
.cta svg{width:1.1em;height:1.1em;transition:transform .2s}.cta:hover svg{transform:translate(2px,-2px)}
.feat{position:relative;align-self:flex-start;min-width:var(--feature-min);padding:var(--feature-pad);display:flex;align-items:center;gap:var(--btn-gap)}
.feat .corner{position:absolute}
.feat .globe{width:var(--globe);height:var(--globe);stroke:#000;stroke-width:1.2;fill:none;flex:none}
.feat p{font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:var(--body);line-height:1.6}
.mob{position:relative;z-index:10;margin:0 var(--pad-x) var(--main-py);aspect-ratio:4/5;border:1px solid #e5e7eb;background:#fff center/cover no-repeat}
@media(min-width:640px){.mob{aspect-ratio:16/9}nav .nl{display:inline}}
@media(min-width:1024px){#bg{display:block}.mob{display:none}main{flex-direction:row}.left{justify-content:center}.feat{align-self:flex-end}}
.back{position:fixed;inset:0;background:rgba(0,0,0,.2);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.back.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:var(--drawer-max);background:#fff;border-left:1px solid #e5e7eb;z-index:50;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:calc(var(--drawer-pad) + env(safe-area-inset-top,0px)) var(--drawer-pad) calc(var(--drawer-pad) + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding-bottom:1rem;border-bottom:1px solid #e5e7eb}
.dh h2{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:calc(var(--body)*1.35)}
.dh svg,.chk svg{width:var(--icon);height:var(--icon);stroke:currentColor;fill:none;stroke-width:1.5}
.sub{margin:1.25rem 0 .5rem;font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:#6b7280}
.list{flex:1;overflow:auto}
.it{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid #e5e7eb}
.it small{display:block;font-size:var(--micro);letter-spacing:.15em;color:#6b7280;text-transform:uppercase;margin-bottom:.25rem}
.it b{font-weight:600;font-size:var(--body);letter-spacing:.08em;text-transform:uppercase;display:block}
.it span{font-size:var(--body);color:#4b5563}
.btn{border:1px solid #000;padding:.45rem .9rem;font-size:var(--micro);letter-spacing:.15em;text-transform:uppercase;font-weight:600;transition:.2s}
.btn:hover{background:#000;color:#fff}
.empty{text-align:center;color:#6b7280;padding-top:30%;font-size:var(--body)}
.empty svg{width:2.5rem;height:2.5rem;stroke:#d1d5db;fill:none;stroke-width:1.5;display:block;margin:0 auto 1rem}
.chk{width:100%;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;gap:.5rem;padding:1rem;letter-spacing:.18em;font-size:var(--body);font-weight:600;margin-top:1rem}
.foot{text-align:center;font-size:var(--micro);letter-spacing:.2em;color:#9ca3af;text-transform:uppercase;padding-top:1rem}
.toast{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));right:1rem;z-index:60;background:#000;color:#fff;padding:.8rem 1rem;font-size:var(--body);display:flex;gap:.6rem;align-items:center;transform:translateY(-200%);transition:.3s;max-width:calc(100% - 2rem)}
.toast.on{transform:none}.toast svg{width:1.1rem;height:1.1rem;stroke:#34d399;fill:none;stroke-width:2;flex:none}
</style>
</head>
<body>
<div class="root">
  <div id="bg"><div id="b1"></div><div id="b2"></div>
    <svg><defs><pattern id="gp" width="48" height="48" patternUnits="userSpaceOnUse" x="0" y="0"><path id="gpath" d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="url(#gp)"/></svg>
  </div>
  <header>
    <button class="logo orb" id="logo">WEST DESIGNS<sup>˚</sup></button>
    <nav>
      <button data-o="shop">Shop</button><button class="nl" data-o="col">Collections</button><button class="nl" data-o="jou">Journal</button>
      <span class="sep">|</span>
      <button class="bag" data-o="cart" aria-label="Shopping bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="badge" id="badge">0</span></button>
    </nav>
  </header>
  <main>
    <div class="left">
      <svg class="corner" viewBox="0 0 12 12"><path d="M0 11.5V0.5H11.5"/></svg>
      <h1 class="orb"><span>FUTURE</span><span>FORWARD</span><span>FASHION
        <svg viewBox="0 0 36 18" fill="#000" id="chk"></svg></span></h1>
      <svg class="corner" viewBox="0 0 12 12"><path d="M0 0.5V11.5H11.5"/></svg>
      <button class="cta" data-o="shop">Shop Now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></button>
    </div>
    <div class="feat">
      <svg class="corner" style="top:0;left:0" viewBox="0 0 12 12"><path d="M0 11.5V0.5H11.5"/></svg>
      <svg class="corner" style="top:0;right:0" viewBox="0 0 12 12"><path d="M0.5 0.5H11.5V11.5"/></svg>
      <svg class="corner" style="bottom:0;left:0" viewBox="0 0 12 12"><path d="M0 0.5V11.5H11.5"/></svg>
      <svg class="corner" style="bottom:0;right:0" viewBox="0 0 12 12"><path d="M0.5 11.5H11.5V0.5"/></svg>
      <svg class="globe" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"/><path d="M4 32h56"/><ellipse cx="32" cy="20" rx="24" ry="6"/><ellipse cx="32" cy="44" rx="24" ry="6"/><path d="M32 4v56"/><ellipse cx="32" cy="32" rx="12" ry="28"/><ellipse cx="32" cy="32" rx="22" ry="28"/></svg>
      <p>Beyond trends.<br>Built for tomorrow.</p>
    </div>
  </main>
  <div class="mob" id="mob"></div>
</div>

<div class="back" id="back"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><h2 class="orb" id="dt"></h2><button id="dx" aria-label="Close"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="dbody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  <div class="foot" id="dfoot">West Designs © 2026 — Future Forward Fashion</div>
</aside>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="tmsg"></span></div>

<script>
(function(){
var IMG1="/assets/base.webp";
var IMG2="/assets/reveal.webp";
var $=function(i){return document.getElementById(i)};
$('b1').style.backgroundImage='url("'+IMG1+'")';$('b2').style.backgroundImage='url("'+IMG2+'")';$('mob').style.backgroundImage='url("'+IMG1+'")';
// checkerboard
var c='';for(var r=0;r<4;r++)for(var k=0;k<(r%2?3:3);k++)c+='<rect x="'+(k*(3.8+2.25*0+7.6)+(r%2===0?2.25:0))+'" y="'+(r*4.5)+'" width="3.8" height="3.8"/>';
$('chk').innerHTML=c;
// data
var SHOP=[["CYBER-TEX OVERCOAT",850,"LIMITED EDITION"],["GEO-MESH TECH HOODIE",320,"NEW DROP"],["ORBITAL TAPERED TROUSERS",290,"IN STOCK"],["MODULAR ALL-WEATHER VEST",410,"PRE-ORDER"]];
var COL=[["SERIES 01","SYNTHETIC HORIZONS","Ultra-durable weather-sealed fabrics with minimalist silhouette architecture."],["SERIES 02","KINETIC FORM","Ergonomic streetwear designed for maximum mobility and temperature equilibrium."],["SERIES 03","MONOCHROME ZERO","Pure black and white structural tailoring crafted from 100% recycled polymers."]];
var JOU=[["AUG 2026","THE ARCHITECTURE OF NEXT-GEN TEXTILES","4 MIN READ"],["JUL 2026","CIRCULAR DESIGN IN HIGH-END APPAREL","6 MIN READ"],["JUN 2026","MINIMALISM AS A FUNCTIONAL STATEMENT","3 MIN READ"]];
var cart=[],open=null,tt;
function toast(m){$('tmsg').textContent=m;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('on')},3000)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  var b=$('dbody'),t=$('dt'),h='',foot=$('dfoot');
  foot.style.display='block';
  if(open==='shop'){t.textContent='Catalog';h='<div class="sub">Featured Garments</div><div class="list">'+SHOP.map(function(s,i){return '<div class="it"><div><small>'+s[2]+'</small><b>'+s[0]+'</b><span>$'+s[1]+'</span></div><button class="btn" data-add="'+i+'">Add</button></div>'}).join('')+'</div>'}
  else if(open==='col'){t.textContent='Archive 2026';h='<div class="sub">Season Lineup</div><div class="list">'+COL.map(function(s){return '<div class="it"><div><small>'+s[0]+'</small><b class="orb">'+s[1]+'</b><span style="display:block;margin-top:.4rem;line-height:1.5">'+s[2]+'</span></div></div>'}).join('')+'</div>'}
  else if(open==='jou'){t.textContent='Editorial';h='<div class="sub">Latest Dispatches</div><div class="list">'+JOU.map(function(s){return '<div class="it"><div><small>'+s[0]+'</small><b>'+s[1]+'</b><span style="font-size:var(--micro);letter-spacing:.15em">'+s[2]+'</span></div></div>'}).join('')+'</div>'}
  else if(open==='cart'){t.textContent='Shopping Bag';foot.style.display='none';
    if(!cart.length)h='<div class="list"><div class="empty"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Your shopping bag is empty.</div></div>';
    else h='<div class="list">'+cart.map(function(s,i){return '<div class="it"><div><b>'+s[0]+'</b><span>$'+s[1]+'</span></div><button class="btn" data-rm="'+i+'">Remove</button></div>'}).join('')+'</div><button class="chk" id="co">CHECKOUT NOW <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>'}
  b.innerHTML=h;
}
function show(o){open=o;render();$('drawer').classList.add('on');$('back').classList.add('on');$('drawer').setAttribute('aria-hidden','false')}
function hide(){open=null;$('drawer').classList.remove('on');$('back').classList.remove('on');$('drawer').setAttribute('aria-hidden','true')}
function badge(){var n=cart.length,e=$('badge');e.textContent=n;e.style.display=n?'flex':'none'}
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-o]');if(o){show(o.dataset.o);return}
  var a=e.target.closest('[data-add]');if(a){var s=SHOP[+a.dataset.add];cart.push([s[0],s[1]]);badge();toast('Added "'+s[0]+'" to your shopping bag.');return}
  var r=e.target.closest('[data-rm]');if(r){cart.splice(+r.dataset.rm,1);badge();render();return}
  if(e.target.closest('#co')){toast('Order submitted successfully!');cart=[];badge();hide();return}
  if(e.target.closest('#dx')||e.target===$('back')||e.target.closest('#logo'))hide();
});
// reveal effect
var mouse={x:innerWidth/2,y:innerHeight/2},sm={x:mouse.x,y:mouse.y},off={x:0,y:0};
var cv=document.createElement('canvas'),cx=cv.getContext('2d'),SC=.5;
var bg=$('bg'),b2=$('b2'),gp=$('gp'),gpath=$('gpath');
addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY});
function size(){cv.width=Math.max(1,Math.round(innerWidth*SC));cv.height=Math.max(1,Math.round(innerHeight*SC));
  var cell=Math.round(Math.min(64,Math.max(36,innerWidth*.028)));gp.setAttribute('width',cell);gp.setAttribute('height',cell);gpath.setAttribute('d','M '+cell+' 0 L 0 0 0 '+cell)}
size();addEventListener('resize',size);
function frame(){
  requestAnimationFrame(frame);
  if(getComputedStyle(bg).display==='none')return;
  sm.x+=(mouse.x-sm.x)*.1;sm.y+=(mouse.y-sm.y)*.1;
  var R=Math.round(Math.min(560,Math.max(220,innerWidth*.22)))*SC,x=sm.x*SC,y=sm.y*SC;
  cx.clearRect(0,0,cv.width,cv.height);
  var g=cx.createRadialGradient(x,y,0,x,y,R);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,1)');g.addColorStop(.6,'rgba(255,255,255,0.75)');g.addColorStop(.75,'rgba(255,255,255,0.4)');g.addColorStop(.88,'rgba(255,255,255,0.12)');g.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,R,0,Math.PI*2);cx.fill();
  var u='url('+cv.toDataURL()+')';
  b2.style.webkitMaskImage=u;b2.style.maskImage=u;b2.style.webkitMaskSize='100% 100%';b2.style.maskSize='100% 100%';
  var bw=bg.clientWidth||1,bh=bg.clientHeight||1,px=(sm.x/bw-.5)*16,py=(sm.y/bh-.5)*16;
  off.x+=(px-off.x)*.06;off.y+=(py-off.y)*.06;gp.setAttribute('x',off.x);gp.setAttribute('y',off.y);
}
frame();
})();
</script>
</body>
</html>
